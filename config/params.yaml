detector: classico          # classico | yolo (futuro)

tiles:
  tamanho_px: 1024
  sobreposicao_px: 128

classico:
  janela_fundo_m: 2.0       # maior que o maior buraco esperado
  k_mad: 6.0                # limiar = mediana + k x MAD da anomalia
  contraste_min: 18         # piso do limiar, em niveis de cinza
  area_min_m2: 0.05
  area_max_m2: 10.0
  solidez_min: 0.6
  alongamento_max: 4.0

severidade:                 # por area do buraco, em m2. Faixas de trabalho, nao sao de norma
  media_a_partir_de: 0.25
  alta_a_partir_de: 1.0

segmentos:
  comprimento_m: 20
