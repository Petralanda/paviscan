detector: classico          # classico | yolo (futuro)

tiles:
  tamanho_px: 1024
  sobreposicao_px: 128

classico:
  janela_fundo_m: 1.5       # mediana para estimar o asfalto "limpo"
  area_min_m2: 0.05
  area_max_m2: 10.0
  solidez_min: 0.6
  alongamento_max: 4.0

geometria:
  margem_corte_m: 0.30      # folga do retangulo de corte em volta do buraco
  profundidade_assumida_m: 0.05

orcamento:
  pavimento: CBUQ           # CBUQ | PMF | TSD
  terreno: regular          # bom | regular | ruim
  bdi: 0.25
  segmento_m: 20
  limite_recapeamento: 0.15 # fracao de area afetada que dispara a opcao C

comparacao:
  tolerancia_m: 0.5
  crescimento_min: 0.20     # variacao relativa de area para contar como "cresceu"
