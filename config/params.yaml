detector: classico          # classico | yolo (futuro)

tiles:
  tamanho_px: 1024          # tamanho minimo do tile (orcamento de memoria)
  sobreposicao_m: 2.5       # > raio do maior buraco (o dono o ve inteiro); duplicatas saem na deduplicacao

classico:
  janela_fundo_m: 2.0       # maior que o maior buraco esperado
  k_mad: 6.0                # limiar = mediana + k x MAD da anomalia
  contraste_min: 18         # piso do limiar, em niveis de cinza
  area_min_m2: 0.05
  area_max_m2: 10.0
  solidez_min: 0.6
  alongamento_max: 4.0
  sigma_m: 0.01             # desfoque leve antes de tudo
  margem_borda_m: 0.05      # ignora a faixa junto a borda da pista
  elemento_m: 0.03          # elemento da abertura/fechamento
  separacao_min_m: 0.4      # distancia minima entre centros para o watershed separar
  conf_contraste_ref: 50    # anomalia media (niveis de cinza) que vale confianca cheia
  conf_borda_ref: 600       # gradiente medio na borda (niveis de cinza por metro) idem

severidade:                 # por area do buraco, em m2. Faixas de trabalho, nao sao de norma
  media_a_partir_de: 0.25
  alta_a_partir_de: 1.0

segmentos:
  comprimento_m: 20

previa:
  margem_m: 5.0             # entorno da pista incluido na previa.png do dashboard

acervo:
  pasta_imagens: ../images   # ortofotos oferecidas no painel; relativa a raiz do repo
